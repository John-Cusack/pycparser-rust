# Release workflow for pycparser-rust (generated by `rustsmith release-prep`).
#
# DO NOT hand-edit here: regenerate from `release.toml` so the workflow stays
# in sync with the release configuration. Publishing order is fixed:
# TestPyPI first (automatic), then manual dispatch publishes the Rust core
# to crates.io FIRST (the binding depends on it by version) and the SAME
# tested artifacts to production PyPI, after the TestPyPI install check.
#
# Trust model: OpenID Connect trusted publishing on both registries. No
# long-lived tokens live in secrets. First-time setup (accounts, publisher
# identities, environments) is in TRUSTED_PUBLISHING_SETUP.md next to this file.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_production:
        description: "Publish verified artifacts to PyPI and the Rust core to crates.io"
        required: true
        default: "false"

permissions:
  contents: read

jobs:
  build:
    name: build wheels (${{ matrix.os }} py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: ['ubuntu-22.04', 'macos-14', 'windows-2022']
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
      - name: core tests (same core Rust consumers use)
        run: cargo test --release --manifest-path pycparser-core/Cargo.toml
        if: matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.9'
      - name: upload wheel (exact file the publish jobs reuse)
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: build sdist (includes the Rust core)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: sdist carries the core (rebuild proof runs in release-prep)
        run: tar tzf dist/*.tar.gz | grep -q 'pycparser-core/Cargo.toml'
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test-wheels:
    name: test wheel (fresh install, no network build)
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Reference cell only: dist/ then holds exactly one wheel, so the
          # install below cannot mix wheels from other OS/Python cells.
          name: wheels-ubuntu-22.04-py3.9
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: install the reference wheel from disk (same file that ships)
        run: pip install dist/*.whl
      - name: smoke (installed package, pinned vectors)
        run: |
          python - <<'PYEOF'
          import pycparser
          assert pycparser.__name__ == 'pycparser', "smoke check failed"
          assert pycparser.CParser().parse('int x;', '').ext[0].name == 'x', "smoke check failed"
          assert 'int x' in __import__('pycparser.c_generator', fromlist=['CGenerator']).CGenerator().visit(pycparser.CParser().parse('int x;', '')), "smoke check failed"
          assert pycparser.CParser(dialect='c23').parse('static_assert(sizeof(int) >= 2, "ok");', '').ext[0].cond is not None, "smoke check failed"
          PYEOF
      - name: upload tested wheels (publish consumes THESE files)
        uses: actions/upload-artifact@v4
        with:
          name: tested-dist
          path: dist/*

  publish-testpypi:
    name: publish to TestPyPI
    needs: [test-wheels, sdist]
    runs-on: ubuntu-22.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: publish the tested artifacts to TestPyPI (no rebuild)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          verify-metadata: true
          skip-existing: true

  verify-testpypi:
    name: verify install from TestPyPI
    needs: [publish-testpypi]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: install from TestPyPI (proves the index, not the local file)
        run: pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ pycparser-rust==0.1.0
      - name: smoke (index-installed package)
        run: |
          python - <<'PYEOF'
          import pycparser
          assert pycparser.__name__ == 'pycparser', "smoke check failed"
          assert pycparser.CParser().parse('int x;', '').ext[0].name == 'x', "smoke check failed"
          assert 'int x' in __import__('pycparser.c_generator', fromlist=['CGenerator']).CGenerator().visit(pycparser.CParser().parse('int x;', '')), "smoke check failed"
          assert pycparser.CParser(dialect='c23').parse('static_assert(sizeof(int) >= 2, "ok");', '').ext[0].cond is not None, "smoke check failed"
          PYEOF

  release:
    name: production release (crates.io core first, then PyPI, manual only)
    needs: [verify-testpypi]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_production == 'true'
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tested-dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: dtolnay/rust-toolchain@stable
      - name: authenticate to crates.io (OIDC, no stored token)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: publish the Rust core to crates.io (core first: the binding depends on it)
        run: cargo publish --manifest-path pycparser-core/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: publish the SAME tested artifacts to PyPI (no rebuild)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verify-metadata: true
          skip-existing: false
      - name: upload release evidence (what release-prep verified plus the state seed)
        # Per-registry recording stays manual via `release-record` (see
        # TRUSTED_PUBLISHING_SETUP.md section 6); this artifact is the audit trail.
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            verification.json
            release-state.json
          if-no-files-found: warn
