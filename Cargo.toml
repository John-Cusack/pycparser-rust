[workspace]
members = ["pycparser-core"]
resolver = "2"

[package]
name = "pycparser-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for the pycparser-rust port"
license = "MIT"
repository = "https://github.com/John-Cusack/pycparser-rust"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pycparser-rust-core = { version = "0.1.0", path = "pycparser-core" }
pyo3 = { version = "0.24", features = ["extension-module"] }
