[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pycparser-rust"
version = "0.1.0"
description = "Rust port of eliben/pycparser (C parser): pycparser-core crate plus a drop-in pycparser binding"
authors = [{ name = "pycparser-rust contributors" }]
maintainers = [{ name = "pycparser-rust publishers" }]
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
keywords = ["c", "parser", "ast", "rust"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/John-Cusack/pycparser-rust"
Upstream = "https://github.com/eliben/pycparser"

[tool.maturin]
module-name = "pycparser._core"
bindings = "pyo3"
# The reusable Rust core ships inside the sdist as a path dependency, so the
# unpacked sdist rebuilds the wheel with no network checkout.
sdist-include = ["pycparser-core/**/*", "NOTICE", "LICENSE", "release.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
